<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a5fb4"/>
      <stop offset="55%" stop-color="#3584e4"/>
      <stop offset="100%" stop-color="#2ec27e"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e2430"/>
      <stop offset="100%" stop-color="#141820"/>
    </linearGradient>
    <linearGradient id="winGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#99c1f1"/>
      <stop offset="100%" stop-color="#62a0ea"/>
    </linearGradient>
    <linearGradient id="standGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9a9996"/>
      <stop offset="100%" stop-color="#5e5c64"/>
    </linearGradient>
  </defs>

  <!-- App squircle backdrop -->
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="url(#bgGrad)"/>
  <rect x="8" y="8" width="112" height="112" rx="26" ry="26" fill="none" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>

  <!-- Monitor stand -->
  <path d="M54 92 L74 92 L78 104 L50 104 Z" fill="#deddda"/>
  <rect x="42" y="102" width="44" height="6" rx="3" fill="#ffffff" fill-opacity="0.92"/>

  <!-- Monitor bezel -->
  <rect x="20" y="26" width="88" height="68" rx="10" ry="10" fill="#241f31"/>
  <rect x="20" y="26" width="88" height="68" rx="10" ry="10" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="2"/>

  <!-- Monitor screen -->
  <rect x="26" y="32" width="76" height="54" rx="5" ry="5" fill="url(#screenGrad)"/>

  <!-- Stylized Windows 4-pane remote display -->
  <g transform="translate(46, 42)">
    <rect x="0" y="0" width="16" height="15" rx="2.5" fill="url(#winGrad)"/>
    <rect x="19" y="0" width="16" height="15" rx="2.5" fill="url(#winGrad)"/>
    <rect x="0" y="18" width="16" height="15" rx="2.5" fill="url(#winGrad)"/>
    <rect x="19" y="18" width="16" height="15" rx="2.5" fill="#57e389"/>
  </g>

  <!-- Connection badge (bottom-right) -->
  <circle cx="96" cy="88" r="16" fill="#26a269" stroke="#ffffff" stroke-width="2.5"/>
  <path d="M90 88 L101 88 M96 83 L102 88 L96 93" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
