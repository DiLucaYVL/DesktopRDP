[package]
name = "desktoprdp"
version = "1.3.0"
edition = "2021"
description = "DesktopRDP for Windows: Libadwaita-style RDP launcher (Tailscale + mstsc.exe)"
license = "MIT"
publish = false

[[bin]]
name = "DesktopRDP"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui_extras = { version = "0.31", default-features = false, features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_System_Registry",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

# Development builds on Linux (to preview the UI); Windows needs no extra windowing feature.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["x11", "wayland"] }
